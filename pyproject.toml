[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "faceup"
version = "0.3.0"
description = "Face unlock for Linux that actually works: dual-spectrum (IR+RGB) recognition with liveness voters, fail-open PAM integration."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["howdy", "face-unlock", "pam", "linux", "infrared", "biometrics"]
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
# Runtime deps come from the distro (they are Howdy's own deps):
#   python3-opencv python3-dlib dlib-models
dependencies = []

[project.scripts]
faceup = "faceup.cli:main"

[project.urls]
Homepage = "https://github.com/<you>/faceup"

[tool.setuptools.packages.find]
include = ["faceup*"]

[tool.setuptools.package-data]
faceup = ["models/*"]
