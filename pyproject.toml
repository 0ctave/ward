[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ward"
version = "0.4.0"
description = "Face unlock for Linux that actually works: dual-spectrum (IR+RGB) recognition with liveness voters, fail-open PAM integration."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "octave" }]
requires-python = ">=3.10"
keywords = ["howdy", "face-unlock", "pam", "linux", "infrared", "biometrics", "liveness", "anti-spoofing", "wayland"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
# Runtime deps come from the distro (they are Howdy's own deps):
#   python3-opencv python3-dlib dlib-models
dependencies = []

[project.scripts]
ward = "ward.cli:main"

[project.urls]
Homepage = "https://github.com/0ctave/ward"
Repository = "https://github.com/0ctave/ward"
Issues = "https://github.com/0ctave/ward/issues"
Changelog = "https://github.com/0ctave/ward/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["ward*"]

[tool.setuptools.package-data]
ward = ["models/*"]

[tool.ruff]
# Ward uses the distro Python with no pip deps; ruff is a CI-only check, scoped to real bugs
# (pyflakes F + syntax E9), not style. Line length is informational only.
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F"]
