name: changelog
on: pull_request

permissions:
  contents: read

jobs:
  fragment:
    runs-on: ubuntu-24.04
    # A PR may opt out with the "skip-changelog" label (e.g. a pure refactor or CI tweak).
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need the base ref to diff against

      - name: Require a changelog.d/ fragment
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          added=$(git diff --name-only --diff-filter=A "$BASE_SHA" "$HEAD_SHA" -- 'changelog.d/*.md' \
                    | grep -v '^changelog.d/README.md$' || true)
          if [ -z "$added" ]; then
            echo "::error::This PR adds no changelog fragment under changelog.d/."
            echo "Add one with:  python3 tools/changelog.py add -t fixed -m \"what changed\""
            echo "Or apply the 'skip-changelog' label if no user-facing entry is needed."
            exit 1
          fi
          echo "Found changelog fragment(s):"
          echo "$added"
