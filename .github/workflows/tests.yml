name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Distro dependencies (the only ones ward uses — no pip)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-opencv python3-numpy gcc libpam0g
          # dlib isn't in the Ubuntu archive; the suite runs without it (mocked detectors), so best-effort:
          sudo apt-get install -y python3-dlib dlib-models || echo 'python3-dlib not available — suite runs without it'
      - name: Unit tests (no camera, no root)
        run: python3 -m unittest discover -s tests -v
      - name: Native PAM module builds
        run: gcc -O2 -Wall -Wextra -fPIC -shared -o /tmp/pam_ward.so data/pam_ward.c
